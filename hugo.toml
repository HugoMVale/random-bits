baseURL = 'https://hugomvale.github.io/random-bits/'
locale = 'en-us'
title = 'Random Bits'
theme = 'PaperMod'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]
